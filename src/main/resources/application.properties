# ==============================================================================
# Server Configuration
# ==============================================================================
server.port=8080

# ==============================================================================
# Datasource Configuration (H2 in-memory by default for zero-config running)
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:smartbanking;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Configuration (Uncomment and edit credentials if switching to MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/smartbanking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================================================
# Application JWT Configuration
# ==============================================================================
# 256-bit Base64 encoded secret key
app.jwt.secret=U21hcnRCYW5raW5nU2VjcmV0S2V5Rm9ySnd0VG9rZW5BdXRoMjAyNlNlY3VyZUtleVhY
# 24 hours in milliseconds
app.jwt.expiration-ms=86400000
# 7 days in milliseconds
app.jwt.refresh-expiration-ms=604800000
app.jwt.cookie-name=smartbank_jwt
app.jwt.refresh-cookie-name=smartbank_refresh

# ==============================================================================
# Banking & Security Rules Configuration
# ==============================================================================
app.banking.fraud.threshold-amount=10000.00
app.security.max-failed-attempts=5
# 15 minutes lockout in milliseconds
app.security.lockout-duration-ms=900000
